version: '3.12'

services:
  chetam:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chetam
    command: gunicorn app.wsgi:application --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: app.settings
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: home
      POSTGRES_PASSWORD: ruslan
      POSTGRES_DB: soc_net
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:

