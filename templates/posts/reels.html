{% extends "base.html" %}

{% block content %}
<div class="reels-container">
    {% for post in posts %}
        <div class="reel-item">
            <a href="{% url 'reel_detail' post.slug %}">  <!-- Используем slug вместо id -->
                <video class="reel-video" controls>
                    <source src="{{ post.video.url }}" type="video/mp4">
                    Ваш браузер не поддерживает элемент video.
                </video>
            </a>
        </div>
    {% endfor %}
</div>
{% endblock %}
